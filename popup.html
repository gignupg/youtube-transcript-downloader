<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Transcript Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>YouTube Transcript Downloader</h1>
      <p id="status">Expanding video description…</p>
    </main>

    <dialog id="dialog">
      <h2 id="dialog-title">Hello world</h2>
      <p id="dialog-message"></p>
      <div id="actions" hidden>
        <button id="copy" type="button">Copy</button>
        <button id="download" type="button">Download .txt</button>
      </div>
      <form method="dialog">
        <button value="ok">OK</button>
      </form>
    </dialog>

    <script src="popup.js"></script>
  </body>
</html>
